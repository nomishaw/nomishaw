<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>答题电视</title>
<style>
  :root {
    --bg: #0d1726;
    --panel: #15233a;
    --panel-2: #1d2f4d;
    --line: #2c4468;
    --text: #eef3fb;
    --muted: #9bb0cf;
    --accent: #3fb36b;
    --accent-2: #2f8f55;
    --danger: #d9534f;
    --warn: #f0b429;
    --focus: #ffd75e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 4px solid var(--focus); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- player ---------- */
  #stage { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  #video { width: 100%; height: 100%; background: #000; }
  #yt-wrap, #yt-wrap iframe { width: 100%; height: 100%; border: 0; }

  #hud { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 5; opacity: .25; transition: opacity .2s; }
  #hud:hover, #hud:focus-within { opacity: 1; }
  .chip { background: rgba(13,23,38,.85); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 15px; }

  /* ---------- source picker ---------- */
  #picker { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 4; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; width: min(640px, 100%); }
  .card h1 { margin: 0 0 6px; font-size: 28px; }
  .card p.sub { margin: 0 0 22px; color: var(--muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .row > * { flex: 1 1 200px; }
  input[type=text], input[type=number], input[type=password], select, textarea {
    background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 12px; font-size: 16px; width: 100%; }
  textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; font-size: 16px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  .btn.ghost { background: transparent; }
  label.file { display: flex; align-items: center; justify-content: center; text-align: center; }
  label.file input { display: none; }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.6; }

  /* ---------- quiz overlay (looks like the TV in the story) ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at center, #1a2b48 0%, #0b1422 75%); }
  #quiz .box { width: min(1100px, 100%); text-align: center; }
  #quiz .title { font-size: clamp(20px, 2.6vw, 32px); font-weight: 700; margin-bottom: 8px; }
  #quiz .progress { color: var(--muted); font-size: clamp(14px, 1.6vw, 18px); margin-bottom: 26px; }
  #quiz .question { font-size: clamp(24px, 3.6vw, 48px); line-height: 1.4; margin-bottom: 36px; min-height: 1.4em; }
  #options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  #options button { background: var(--panel-2); border: 2px solid var(--line); border-radius: 10px; padding: 18px 8px;
    font-size: clamp(18px, 2.4vw, 30px); min-height: 72px; transition: transform .1s; }
  #options button:hover { border-color: var(--muted); }
  #options button:focus-visible { transform: scale(1.05); }
  #options button.right { background: var(--accent); border-color: var(--accent); }
  #options button.wrong { background: var(--danger); border-color: var(--danger); }
  #options button:disabled { cursor: default; }
  #quiz .feedback { margin-top: 26px; font-size: clamp(18px, 2.4vw, 28px); font-weight: 700; min-height: 1.5em; }
  #quiz .feedback.bad { color: #ff8a80; }
  #quiz .feedback.good { color: #7ee2a0; }
  @media (max-width: 640px) { #options { grid-template-columns: repeat(2, 1fr); } }

  #lock .big { font-size: 64px; margin-bottom: 10px; }
  #lock h2 { font-size: clamp(26px, 4vw, 44px); margin: 0 0 10px; }
  #lock p { color: var(--muted); font-size: 18px; margin: 0 0 28px; }

  /* ---------- parent modal ---------- */
  #parent { z-index: 20; background: rgba(0,0,0,.7); align-items: flex-start; overflow-y: auto; }
  #parent .card { margin: 24px auto; width: min(760px, 100%); }
  .status { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font-size: 18px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.on { background: var(--accent); } .dot.off { background: var(--danger); }
  .stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .stack .btn { padding: 16px; font-size: 18px; }
  h3 { margin: 22px 0 10px; font-size: 18px; color: var(--muted); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid2 label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 26px; }
  .stat span { font-size: 13px; color: var(--muted); }
  .log { max-height: 180px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; line-height: 1.7; color: var(--muted); margin-top: 10px; }
  .log .x { color: #ff8a80; } .log .o { color: #7ee2a0; }

  #pin .card { width: min(380px, 100%); text-align: center; }
  #pin input { text-align: center; font-size: 28px; letter-spacing: 10px; margin: 14px 0; }
  #pin .err { color: #ff8a80; min-height: 1.4em; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line);
    padding: 12px 20px; border-radius: 10px; z-index: 30; font-size: 16px; }
</style>
</head>
<body>

<!-- Player -->
<div id="stage">
  <video id="video" controls playsinline></video>
  <div id="yt-wrap" class="hidden"><div id="yt"></div></div>
</div>

<div id="hud">
  <span class="chip" id="hud-status">—</span>
  <button class="chip" id="hud-source" title="换片源">📁 换片</button>
  <button class="chip" id="hud-parent" title="家长 (P)">🔒 家长</button>
</div>

<!-- Source picker -->
<div id="picker">
  <div class="card">
    <h1>📺 答题电视</h1>
    <p class="sub">每看一段时间就要答一道题，答对才能继续看。</p>
    <div class="row">
      <label class="btn primary file">选择本地视频…<input type="file" id="file" accept="video/*" multiple></label>
    </div>
    <div class="row">
      <input type="text" id="url" placeholder="或粘贴视频链接（.mp4 / YouTube）">
      <button class="btn" id="url-go" style="flex:0 0 auto">播放</button>
    </div>
    <p class="hint">提示：电视上打开本页，或用电脑全屏后投屏到电视。按 <b>P</b> 键或点右上角「家长」进入家长面板（首次默认密码 <b>0000</b>，请尽快修改）。</p>
  </div>
</div>

<!-- Quiz -->
<div id="quiz" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="box">
    <div class="title">休息一下，答对才能继续</div>
    <div class="progress" id="q-progress"></div>
    <div class="question" id="q-text"></div>
    <div id="options"></div>
    <div class="feedback" id="q-feedback" aria-live="polite"></div>
  </div>
</div>

<!-- Lock screen -->
<div id="lock" class="overlay hidden" role="dialog" aria-modal="true">
  <div style="text-align:center">
    <div class="big">🔒</div>
    <h2>电视已锁定</h2>
    <p id="lock-reason">家长已锁屏，去做点别的事吧！</p>
    <button class="btn primary" id="lock-unlock">家长解锁</button>
  </div>
</div>

<!-- PIN -->
<div id="pin" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="card">
    <h2 style="margin:0">家长验证</h2>
    <input type="password" id="pin-input" inputmode="numeric" maxlength="8" autocomplete="off">
    <div class="err" id="pin-err"></div>
    <div class="row">
      <button class="btn ghost" id="pin-cancel">取消</button>
      <button class="btn primary" id="pin-ok">确定</button>
    </div>
  </div>
</div>

<!-- Parent panel -->
<div id="parent" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0">家长面板</h2>
      <button class="btn ghost" id="p-close">关闭 ✕</button>
    </div>

    <div class="status"><span class="dot" id="p-dot"></span><span id="p-status"></span></div>

    <div class="stack">
      <button class="btn primary" id="p-unlock">大人解锁 2 小时（免答题）</button>
      <button class="btn danger" id="p-lock">立即锁屏</button>
      <button class="btn" id="p-cancel">取消解锁 / 恢复答题模式</button>
      <button class="btn" id="p-quiz-now">现在就出一道题</button>
    </div>

    <h3>今日统计</h3>
    <div class="stats">
      <div class="stat"><b id="s-watch">0</b><span>观看分钟</span></div>
      <div class="stat"><b id="s-right">0</b><span>答对</span></div>
      <div class="stat"><b id="s-wrong">0</b><span>答错</span></div>
    </div>
    <div class="log" id="s-log"></div>

    <h3>规则设置</h3>
    <div class="grid2">
      <label>每看几分钟答一次题<input type="number" id="c-interval" min="1" max="120"></label>
      <label>答错后等待（秒）<input type="number" id="c-penalty" min="0" max="600"></label>
      <label>答错追加题数<input type="number" id="c-extra" min="0" max="5"></label>
      <label>最多累计题数<input type="number" id="c-max" min="1" max="10"></label>
      <label>题库
        <select id="c-bank">
          <option value="math7">初一数学</option>
          <option value="math5">小学高年级数学</option>
          <option value="mix">数学 + 英语单词</option>
          <option value="custom">仅自定义题目</option>
        </select>
      </label>
      <label>每日观看上限（分钟，0=不限）<input type="number" id="c-daily" min="0" max="600"></label>
    </div>

    <h3>自定义题目（每行一题：题目 | 正确答案 | 错误答案1 | 错误答案2 …）</h3>
    <textarea id="c-custom" placeholder="中国的首都是哪里？ | 北京 | 上海 | 广州 | 南京&#10;apple 的意思是 | 苹果 | 香蕉 | 橙子 | 葡萄"></textarea>

    <h3>修改家长密码</h3>
    <div class="row">
      <input type="password" id="c-pin" inputmode="numeric" maxlength="8" placeholder="新密码（4–8 位数字）">
      <button class="btn" id="c-pin-save" style="flex:0 0 auto">保存密码</button>
    </div>

    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="c-save">保存设置</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const KEY = 'tvquiz.v1';
  const today = () => new Date().toLocaleDateString('sv');

  // ---------------- persistent state ----------------
  const defaults = {
    pin: '0000',
    cfg: { interval: 10, penalty: 58, extra: 1, max: 3, bank: 'math7', daily: 0, custom: '' },
    watched: 0,            // seconds watched since last quiz
    pending: 0,            // questions still owed
    cooldownUntil: 0,      // wait after a wrong answer
    unlockUntil: 0,        // parent unlock (no quizzes)
    locked: false,
    day: today(),
    stats: { watch: 0, right: 0, wrong: 0, log: [] },
  };
  let S;
  try { S = Object.assign(structuredClone(defaults), JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch { S = structuredClone(defaults); }
  S.cfg = Object.assign({}, defaults.cfg, S.cfg);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
  const rollDay = () => {
    if (S.day !== today()) { S.day = today(); S.stats = structuredClone(defaults.stats); save(); }
  };
  rollDay();

  // ---------------- question bank ----------------
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const neg = (n) => (n < 0 ? `(${n})` : `${n}`);

  // Build 8 numeric options around the answer (plus optional "likely mistakes").
  function numOptions(ans, traps = [], fmt = (x) => String(x)) {
    const set = new Set([ans]);
    traps.forEach((t) => { if (Number.isInteger(t) && set.size < 8) set.add(t); });
    const spread = Math.max(3, Math.round(Math.abs(ans) * 0.3));
    let guard = 0;
    while (set.size < 8 && guard++ < 200) set.add(ans + ri(-spread, spread));
    return { answer: fmt(ans), options: shuffle([...set]).map(fmt) };
  }

  const gens = {
    triangle() {
      const a = ri(25, 85), b = ri(20, 150 - a), c = 180 - a - b;
      const deg = (x) => `${x}°`;
      return { q: `三角形两个内角分别是 ${a}° 和 ${b}°，第三个角是多少？`,
               ...numOptions(c, [a + b, 180 - a, 180 - b, 90, 360 - a - b], deg) };
    },
    integers() {
      const a = ri(-30, 30), b = ri(-30, 30), op = pick(['+', '−']);
      const ans = op === '+' ? a + b : a - b;
      return { q: `计算：${neg(a)} ${op} ${neg(b)} = ?`, ...numOptions(ans, [-ans, op === '+' ? a - b : a + b]) };
    },
    multiply() {
      const a = ri(-12, 12) || 3, b = ri(-12, 12) || -4;
      return { q: `计算：${neg(a)} × ${neg(b)} = ?`, ...numOptions(a * b, [-a * b, a + b]) };
    },
    power() {
      const base = pick([-3, -2, 2, 3, -1, 4, -4, 5]), e = base ** 2 > 9 ? 2 : ri(2, 3);
      const ans = base ** e;
      return { q: `计算：${neg(base)}${e === 2 ? '²' : '³'} = ?`, ...numOptions(ans, [-ans, base * e, -(Math.abs(base) ** e)]) };
    },
    equation() {
      const x = ri(-9, 12), a = pick([2, 3, 4, 5, -2, -3]), b = ri(-15, 15), c = a * x + b;
      const bs = b === 0 ? '' : b > 0 ? ` + ${b}` : ` − ${-b}`;
      return { q: `解方程：${a}x${bs} = ${c}，x = ?`, ...numOptions(x, [-x, (c + b) / a, c - b]) };
    },
    evaluate() {
      const x = ri(-6, 6), a = ri(2, 6), b = ri(-9, 9);
      const bs = b === 0 ? '' : b > 0 ? ` + ${b}` : ` − ${-b}`;
      return { q: `当 x = ${x} 时，${a}x${bs} 的值是多少？`, ...numOptions(a * x + b, [a * -x + b, a + x + b]) };
    },
    absolute() {
      const a = ri(-20, -1), b = ri(-20, 20);
      return { q: `计算：|${a}| + |${b}| = ?`, ...numOptions(Math.abs(a) + Math.abs(b), [a + b, Math.abs(a + b)]) };
    },
    percent() {
      const p = pick([10, 20, 25, 30, 40, 50, 75, 15]), n = pick([40, 60, 80, 120, 200, 240, 360]);
      return { q: `${n} 的 ${p}% 是多少？`, ...numOptions((n * p) / 100, [n - (n * p) / 100, p]) };
    },
    arith5() {
      const a = ri(12, 99), b = ri(3, 12), c = ri(10, 99);
      return { q: `计算：${a} × ${b} − ${c} = ?`, ...numOptions(a * b - c, [a * b, a * b + c - 10, a * b - c + 10]) };
    },
    division5() {
      const b = ri(3, 12), ans = ri(6, 40), r = 0;
      return { q: `计算：${b * ans + r} ÷ ${b} = ?`, ...numOptions(ans) };
    },
    area5() {
      const w = ri(3, 15), h = ri(3, 15);
      return { q: `长 ${w} 厘米、宽 ${h} 厘米的长方形，面积是多少平方厘米？`, ...numOptions(w * h, [2 * (w + h), w + h]) };
    },
    perimeter5() {
      const w = ri(3, 20), h = ri(3, 20);
      return { q: `长 ${w} 米、宽 ${h} 米的长方形，周长是多少米？`, ...numOptions(2 * (w + h), [w * h, w + h]) };
    },
    english() {
      const words = [['apple', '苹果'], ['library', '图书馆'], ['weather', '天气'], ['science', '科学'], ['history', '历史'],
        ['triangle', '三角形'], ['careful', '小心的'], ['delicious', '美味的'], ['yesterday', '昨天'], ['umbrella', '雨伞'],
        ['kitchen', '厨房'], ['homework', '家庭作业'], ['beautiful', '美丽的'], ['country', '国家'], ['dangerous', '危险的'],
        ['different', '不同的'], ['hospital', '医院'], ['exercise', '锻炼'], ['vegetable', '蔬菜'], ['important', '重要的']];
      const [en, zh] = pick(words);
      const wrong = shuffle(words.filter((w) => w[0] !== en)).slice(0, 7).map((w) => w[1]);
      return { q: `“${en}” 是什么意思？`, answer: zh, options: shuffle([zh, ...wrong]) };
    },
  };

  function parseCustom() {
    return S.cfg.custom.split('\n').map((l) => l.split('|').map((s) => s.trim()).filter(Boolean))
      .filter((p) => p.length >= 3)
      .map(([q, answer, ...wrong]) => () => ({ q, answer, options: shuffle([answer, ...wrong.slice(0, 7)]) }));
  }

  function nextQuestion() {
    const banks = {
      math7: ['triangle', 'integers', 'multiply', 'power', 'equation', 'evaluate', 'absolute', 'percent'],
      math5: ['arith5', 'division5', 'area5', 'perimeter5', 'triangle', 'percent'],
      mix: ['triangle', 'integers', 'equation', 'evaluate', 'percent', 'english', 'english'],
      custom: [],
    };
    const pool = (banks[S.cfg.bank] || banks.math7).map((k) => gens[k]);
    const custom = parseCustom();
    const all = S.cfg.bank === 'custom' ? custom : pool.concat(custom);
    return pick(all.length ? all : pool.length ? pool : [gens.integers])();
  }

  // ---------------- player abstraction ----------------
  const video = $('video');
  let yt = null, usingYT = false, playlist = [], plIndex = 0;

  const player = {
    playing() {
      if (usingYT) return !!yt && typeof yt.getPlayerState === 'function' && yt.getPlayerState() === 1;
      return !video.paused && !video.ended && video.readyState > 2;
    },
    pause() { if (usingYT) { yt && yt.pauseVideo && yt.pauseVideo(); } else video.pause(); },
    play() { if (usingYT) { yt && yt.playVideo && yt.playVideo(); } else video.play().catch(() => {}); },
    hasSource() { return usingYT ? !!yt : !!video.currentSrc; },
  };

  function showVideo() { usingYT = false; $('yt-wrap').classList.add('hidden'); video.classList.remove('hidden'); $('picker').classList.add('hidden'); }

  function playFile(i) {
    plIndex = i;
    showVideo();
    if (yt && yt.stopVideo) yt.stopVideo();
    video.src = URL.createObjectURL(playlist[i]);
    if (canWatch()) player.play();
  }
  video.addEventListener('ended', () => { if (playlist.length && plIndex + 1 < playlist.length) playFile(plIndex + 1); });

  $('file').addEventListener('change', (e) => {
    playlist = [...e.target.files];
    if (playlist.length) playFile(0);
  });

  function ytId(u) {
    const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    return m && m[1];
  }
  function loadYT(id) {
    usingYT = true;
    video.pause(); video.classList.add('hidden');
    $('yt-wrap').classList.remove('hidden'); $('picker').classList.add('hidden');
    const make = () => {
      if (yt) { yt.loadVideoById(id); return; }
      yt = new YT.Player('yt', { videoId: id, playerVars: { autoplay: 1, rel: 0, playsinline: 1 },
        events: { onStateChange: (e) => { if (e.data === 1 && !canWatch()) yt.pauseVideo(); } } });
    };
    if (window.YT && YT.Player) make();
    else {
      window.onYouTubeIframeAPIReady = make;
      const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
    }
  }
  $('url-go').addEventListener('click', () => {
    const u = $('url').value.trim(); if (!u) return;
    const id = ytId(u);
    if (id) loadYT(id); else { playlist = []; showVideo(); video.src = u; if (canWatch()) player.play(); }
  });
  $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('url-go').click(); });
  $('hud-source').addEventListener('click', () => { player.pause(); $('picker').classList.remove('hidden'); });

  // ---------------- core rules ----------------
  const now = () => Date.now();
  const unlocked = () => S.unlockUntil > now();
  const dailyCapHit = () => S.cfg.daily > 0 && S.stats.watch >= S.cfg.daily * 60;
  const inQuiz = () => S.pending > 0;
  const canWatch = () => !S.locked && !dailyCapHit() && (unlocked() || !inQuiz());

  function log(text, cls = '') {
    const t = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    S.stats.log.unshift({ t, text, cls });
    S.stats.log = S.stats.log.slice(0, 60);
  }

  let current = null, answered = false, cooldownTimer = null;

  function renderQuestion() {
    current = nextQuestion(); answered = false;
    $('q-text').textContent = current.q;
    $('q-feedback').textContent = ''; $('q-feedback').className = 'feedback';
    $('q-progress').textContent = S.pending > 1 ? `还需答对 ${S.pending} 道题` : '答对这一道就能继续看';
    const box = $('options'); box.innerHTML = '';
    current.options.forEach((opt) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = opt;
      b.addEventListener('click', () => answer(b, opt));
      box.appendChild(b);
    });
    box.firstChild && box.firstChild.focus();
  }

  function answer(btn, opt) {
    if (answered) return;
    answered = true;
    const buttons = [...$('options').children];
    buttons.forEach((b) => (b.disabled = true));
    const fb = $('q-feedback');
    if (opt === current.answer) {
      btn.classList.add('right');
      S.pending = Math.max(0, S.pending - 1);
      S.stats.right++; log(`✔ ${current.q}`, 'o');
      fb.className = 'feedback good';
      fb.textContent = S.pending ? `答对了！还剩 ${S.pending} 道` : '答对了！继续看吧 🎉';
      save();
      setTimeout(() => { if (S.pending) renderQuestion(); else closeQuiz(); }, 1200);
    } else {
      btn.classList.add('wrong');
      buttons.find((b) => b.textContent === current.answer)?.classList.add('right');
      S.pending = Math.min(S.cfg.max, S.pending + S.cfg.extra);
      S.stats.wrong++; log(`✘ ${current.q}（选了 ${opt}，正确 ${current.answer}）`, 'x');
      S.cooldownUntil = now() + S.cfg.penalty * 1000;
      fb.className = 'feedback bad';
      save();
      startCooldown();
    }
  }

  function startCooldown() {
    clearInterval(cooldownTimer);
    const tick = () => {
      const left = Math.ceil((S.cooldownUntil - now()) / 1000);
      if (left <= 0) { clearInterval(cooldownTimer); S.cooldownUntil = 0; save(); renderQuestion(); return; }
      $('q-feedback').className = 'feedback bad';
      $('q-feedback').textContent = `答错了，${left} 秒后换一道新题` + (S.pending > 1 ? `（已追加，共需答对 ${S.pending} 道）` : '');
    };
    tick(); cooldownTimer = setInterval(tick, 500);
  }

  function openQuiz() {
    player.pause();
    $('quiz').classList.remove('hidden');
    if (S.cooldownUntil > now()) {
      // Resumed during a penalty (e.g. after refresh): show a blank question area while waiting.
      $('q-text').textContent = ''; $('options').innerHTML = ''; $('q-progress').textContent = `还需答对 ${S.pending} 道题`;
      startCooldown();
    } else renderQuestion();
  }
  function closeQuiz() {
    clearInterval(cooldownTimer);
    $('quiz').classList.add('hidden');
    S.watched = 0; save();
    if (player.hasSource() && canWatch()) player.play();
  }
  function triggerQuiz() {
    if (S.pending === 0) S.pending = 1;
    S.watched = 0; save(); openQuiz();
  }

  // ---------------- main loop (1s) ----------------
  setInterval(() => {
    rollDay();
    if (S.locked || dailyCapHit()) {
      player.pause();
      $('lock-reason').textContent = S.locked ? '家长已锁屏，去做点别的事吧！' : `今天已经看满 ${S.cfg.daily} 分钟啦，明天再看！`;
      $('lock').classList.remove('hidden'); $('quiz').classList.add('hidden');
    } else {
      $('lock').classList.add('hidden');
      if (unlocked()) {
        $('quiz').classList.add('hidden');
      } else if (inQuiz()) {
        if ($('quiz').classList.contains('hidden')) openQuiz();
        player.pause();
      } else if (player.playing()) {
        S.watched++;
        if (S.watched >= S.cfg.interval * 60) triggerQuiz();
      }
    }
    if (player.playing()) S.stats.watch++;
    if (S.unlockUntil && !unlocked()) { S.unlockUntil = 0; S.watched = 0; log('大人解锁结束，恢复答题'); }
    save();
    renderStatus();
  }, 1000);

  function statusText() {
    if (S.locked) return { cls: 'off', t: '已锁屏' };
    if (dailyCapHit()) return { cls: 'off', t: '今日观看已达上限' };
    if (unlocked()) return { cls: 'on', t: `大人解锁中，还剩约 ${Math.ceil((S.unlockUntil - now()) / 60000)} 分钟` };
    if (inQuiz()) return { cls: '', t: `答题中，还需答对 ${S.pending} 道` };
    const left = Math.max(0, S.cfg.interval * 60 - S.watched);
    return { cls: 'on', t: `答题模式：${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} 后出题` };
  }
  function renderStatus() {
    const s = statusText();
    $('hud-status').textContent = s.t;
    if ($('parent').classList.contains('hidden')) return;
    $('p-status').textContent = s.t; $('p-dot').className = 'dot ' + s.cls;
    $('s-watch').textContent = Math.floor(S.stats.watch / 60);
    $('s-right').textContent = S.stats.right; $('s-wrong').textContent = S.stats.wrong;
  }
  function renderLog() {
    $('s-log').innerHTML = S.stats.log.length
      ? S.stats.log.map((l) => `<div class="${l.cls}">${l.t}　${l.text.replace(/[<&]/g, (c) => (c === '<' ? '&lt;' : '&amp;'))}</div>`).join('')
      : '今天还没有记录';
  }

  // ---------------- parent auth & panel ----------------
  let pinThen = null, failCount = 0, failUntil = 0;
  function askPin(then) {
    pinThen = then;
    $('pin-input').value = ''; $('pin-err').textContent = '';
    $('pin').classList.remove('hidden'); $('pin-input').focus();
  }
  function checkPin() {
    if (failUntil > now()) { $('pin-err').textContent = `错误次数太多，请 ${Math.ceil((failUntil - now()) / 1000)} 秒后再试`; return; }
    if ($('pin-input').value === S.pin) {
      failCount = 0; $('pin').classList.add('hidden');
      const f = pinThen; pinThen = null; f && f();
    } else {
      failCount++; $('pin-input').value = '';
      if (failCount >= 3) { failUntil = now() + 60000; failCount = 0; log('家长密码连续输错 3 次', 'x'); save(); }
      $('pin-err').textContent = failUntil > now() ? '错误次数太多，请 60 秒后再试' : '密码不对';
    }
  }
  $('pin-ok').addEventListener('click', checkPin);
  $('pin-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkPin(); if (e.key === 'Escape') $('pin-cancel').click(); });
  $('pin-cancel').addEventListener('click', () => { $('pin').classList.add('hidden'); pinThen = null; });

  function openParent() {
    const c = S.cfg;
    $('c-interval').value = c.interval; $('c-penalty').value = c.penalty; $('c-extra').value = c.extra;
    $('c-max').value = c.max; $('c-bank').value = c.bank; $('c-daily').value = c.daily; $('c-custom').value = c.custom;
    $('parent').classList.remove('hidden');
    renderLog(); renderStatus(); $('p-unlock').focus();
  }
  const closeParent = () => $('parent').classList.add('hidden');
  const parentGate = () => askPin(openParent);

  $('hud-parent').addEventListener('click', parentGate);
  $('lock-unlock').addEventListener('click', parentGate);
  $('p-close').addEventListener('click', closeParent);

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
  }

  $('p-unlock').addEventListener('click', () => {
    S.locked = false; S.unlockUntil = now() + 2 * 3600 * 1000; S.pending = 0; S.cooldownUntil = 0;
    clearInterval(cooldownTimer); $('quiz').classList.add('hidden');
    log('大人解锁 2 小时'); save(); renderStatus(); toast('已解锁 2 小时');
    closeParent(); if (player.hasSource()) player.play();
  });
  $('p-lock').addEventListener('click', () => {
    S.locked = true; S.unlockUntil = 0; log('家长立即锁屏', 'x'); save(); player.pause(); renderStatus(); toast('已锁屏'); closeParent();
  });
  $('p-cancel').addEventListener('click', () => {
    S.locked = false; S.unlockUntil = 0; S.watched = 0; log('取消解锁，恢复答题模式'); save(); renderStatus(); toast('已恢复答题模式'); closeParent();
    if (player.hasSource() && canWatch()) player.play();
  });
  $('p-quiz-now').addEventListener('click', () => { S.unlockUntil = 0; S.locked = false; closeParent(); triggerQuiz(); });

  const clampNum = (v, lo, hi, d) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
  $('c-save').addEventListener('click', () => {
    const c = S.cfg;
    c.interval = clampNum($('c-interval').value, 1, 120, 10);
    c.penalty = clampNum($('c-penalty').value, 0, 600, 58);
    c.extra = clampNum($('c-extra').value, 0, 5, 1);
    c.max = clampNum($('c-max').value, 1, 10, 3);
    c.daily = clampNum($('c-daily').value, 0, 600, 0);
    c.bank = $('c-bank').value; c.custom = $('c-custom').value;
    if (c.bank === 'custom' && !parseCustom().length) { toast('自定义题库为空，已改回初一数学'); c.bank = 'math7'; $('c-bank').value = 'math7'; }
    S.pending = Math.min(S.pending, c.max);
    save(); toast('设置已保存');
  });
  $('c-pin-save').addEventListener('click', () => {
    const v = $('c-pin').value.trim();
    if (!/^\d{4,8}$/.test(v)) { toast('密码需为 4–8 位数字'); return; }
    S.pin = v; $('c-pin').value = ''; save(); toast('密码已修改');
  });

  // ---------------- keyboard / TV remote ----------------
  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
    if ((e.key === 'p' || e.key === 'P') && !typing && $('pin').classList.contains('hidden') && $('parent').classList.contains('hidden')) {
      e.preventDefault(); parentGate(); return;
    }
    if (e.key === 'Escape' && !$('parent').classList.contains('hidden')) { closeParent(); return; }
    // Arrow-key navigation across the 4-column answer grid (for TV remotes).
    if (!$('quiz').classList.contains('hidden') && $('pin').classList.contains('hidden')) {
      const btns = [...$('options').children]; const i = btns.indexOf(document.activeElement);
      const cols = getComputedStyle($('options')).gridTemplateColumns.split(' ').length;
      const move = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols }[e.key];
      if (move !== undefined && btns.length) {
        e.preventDefault();
        const n = i < 0 ? 0 : Math.min(btns.length - 1, Math.max(0, i + move));
        btns[n].focus();
      }
    }
  });

  // Child can't sneak past the overlay with the native video controls.
  video.addEventListener('play', () => { if (!canWatch()) video.pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  renderStatus();
})();
</script>
</body>
</html>
