<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>答题电视 · 家长</title>
<style>
  :root { --bg:#0d1726; --panel:#15233a; --panel-2:#1d2f4d; --line:#2c4468; --text:#eef3fb; --muted:#9bb0cf;
    --accent:#3fb36b; --danger:#d9534f; --warn:#f0b429; --focus:#ffd75e; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:focus, input:focus, select:focus, textarea:focus, label.app:focus-within { outline:3px solid var(--focus); outline-offset:2px; }
  .hidden { display:none !important; }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; }
  h1 { font-size:24px; margin:0; }
  h3 { margin:26px 0 10px; font-size:17px; color:var(--muted); font-weight:600; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .status { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:18px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--warn); flex:none; }
  .dot.on { background:var(--accent); } .dot.off { background:var(--danger); }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .btn { background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:15px 18px; font-size:17px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .btn.danger { background:var(--danger); border-color:var(--danger); color:#fff; font-weight:600; }
  .btn.small { padding:9px 14px; font-size:15px; }
  input, select, textarea { background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px; font-size:16px; width:100%; }
  textarea { min-height:110px; font-family:ui-monospace, Menlo, monospace; font-size:14px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid2 label { display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--muted); }
  @media (max-width:560px) { .grid2 { grid-template-columns:1fr; } }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:26px; } .stat span { font-size:13px; color:var(--muted); }
  .log { max-height:200px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.7; color:var(--muted); margin-top:10px; }
  .log .x { color:#ff8a80; } .log .o { color:#7ee2a0; }
  .apps { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:8px; }
  label.app { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; cursor:pointer; }
  label.app input { width:20px; height:20px; flex:none; }
  label.app small { display:block; color:var(--muted); font-size:11px; word-break:break-all; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .warn-box { background:#3b2a07; border:1px solid var(--warn); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:15px; line-height:1.6; }
  .ok-box { background:#0f2f1d; border:1px solid var(--accent); }
  code { background:var(--bg); padding:2px 6px; border-radius:6px; font-size:13px; word-break:break-all; }
  .hint { color:var(--muted); font-size:14px; line-height:1.6; }
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  #login .card { width:min(380px,100%); text-align:center; }
  #login input { text-align:center; font-size:28px; letter-spacing:10px; margin:14px 0; }
  .err { color:#ff8a80; min-height:1.4em; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--line); padding:12px 20px; border-radius:10px; z-index:9; }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>📺 答题电视 · 家长</h1>
    <input type="password" id="l-pin" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="密码">
    <div class="err" id="l-err"></div>
    <button class="btn primary" id="l-ok" style="width:100%">登录</button>
    <p class="hint" id="l-hint">首次默认密码 0000</p>
  </div>
</div>

<div id="main" class="wrap hidden">
  <header>
    <h1>家长面板</h1>
    <div style="display:flex;gap:8px">
      <button class="btn small" id="b-logout">退出</button>
      <button class="btn small hidden" id="b-close">关闭 ✕</button>
    </div>
  </header>

  <div id="perm-box" class="warn-box hidden"></div>
  <div id="pin-warn" class="warn-box hidden">⚠️ 还在用默认密码 0000，请在下面「修改家长密码」里改掉。</div>

  <div class="status"><span class="dot" id="dot"></span><span id="status">…</span></div>
  <div class="stack">
    <button class="btn primary" data-action="unlock">大人解锁 2 小时（免答题）</button>
    <button class="btn danger" data-action="lock">立即锁屏</button>
    <button class="btn" data-action="cancel">取消解锁 / 恢复答题模式</button>
    <button class="btn" data-action="quiz">马上出一道题</button>
  </div>

  <h3>今日统计</h3>
  <div class="stats">
    <div class="stat"><b id="s-watch">0</b><span>观看分钟</span></div>
    <div class="stat"><b id="s-right">0</b><span>答对</span></div>
    <div class="stat"><b id="s-wrong">0</b><span>答错</span></div>
  </div>
  <div class="log" id="s-log"></div>

  <h3>哪些 App 算「看视频」（打开时计时）</h3>
  <div class="apps" id="apps"></div>

  <h3>规则</h3>
  <div class="grid2">
    <label>每看几分钟答一次题<input type="number" id="c-interval" min="1" max="120"></label>
    <label>答错后等待（秒）<input type="number" id="c-penalty" min="0" max="600"></label>
    <label>答错追加题数<input type="number" id="c-extra" min="0" max="5"></label>
    <label>最多累计题数<input type="number" id="c-maxPending" min="1" max="10"></label>
    <label>题库
      <select id="c-bank">
        <option value="p2">小二数学 / Primary 2</option>
        <option value="p4">小四数学 / Primary 4</option>
        <option value="math5">小学高年级数学 / Upper primary</option>
        <option value="math7">初一数学 / Secondary 1</option>
        <option value="mix">数学 + 英语单词 / Math + English words</option>
        <option value="custom">仅自定义题目</option>
      </select>
    </label>
    <label>每日观看上限（分钟，0 = 不限）<input type="number" id="c-daily" min="0" max="600"></label>
    <label>题目语言 / Quiz language
      <select id="c-lang">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
  <h3>自定义题目（每行一题：题目 | 正确答案 | 错误答案1 | 错误答案2 …）</h3>
  <textarea id="c-custom" placeholder="中国的首都是哪里？ | 北京 | 上海 | 广州 | 南京"></textarea>
  <div style="margin-top:14px"><button class="btn primary" id="b-save" style="width:100%">保存规则和 App 列表</button></div>

  <h3>修改家长密码</h3>
  <div class="row">
    <input type="password" id="c-pin" inputmode="numeric" maxlength="8" placeholder="新密码（4–8 位数字）">
    <button class="btn" id="b-pin" style="flex:0 0 auto">保存密码</button>
  </div>

  <h3>手机遥控</h3>
  <p class="hint" id="phone-url"></p>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const onTV = !!window.Native;
  const store = {
    get() { try { return localStorage.getItem('tvq.token') || ''; } catch { return ''; } },
    set(v) { try { v ? localStorage.setItem('tvq.token', v) : localStorage.removeItem('tvq.token'); } catch {} },
  };
  // On the TV, always ask for the PIN (the child can open the app too).
  let token = onTV ? (Native.token() || '') : store.get();
  let state = null, formFilled = false, poll = null;

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
  }
  async function api(path, body) {
    const r = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: { 'Content-Type': 'application/json', 'X-Token': token },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { logout(); throw new Error('login'); }
    if (!r.ok) throw new Error(data.error || '出错了');
    return data;
  }

  // ---- login ----
  async function login() {
    $('l-err').textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('l-pin').value }) });
      const d = await r.json();
      if (!r.ok) { $('l-err').textContent = d.error || '登录失败'; $('l-pin').value = ''; return; }
      token = d.token; if (!onTV) store.set(token);
      enter();
    } catch { $('l-err').textContent = '连不上电视，确认手机和电视在同一个 Wi-Fi'; }
  }
  $('l-ok').addEventListener('click', login);
  $('l-pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

  function logout() {
    if (token) fetch('/api/logout', { method: 'POST', headers: { 'X-Token': token } }).catch(() => {});
    token = ''; store.set(''); clearInterval(poll); formFilled = false;
    $('main').classList.add('hidden'); $('login').classList.remove('hidden');
    $('l-pin').value = ''; $('l-pin').focus();
  }
  $('b-logout').addEventListener('click', logout);
  if (onTV) { $('b-close').classList.remove('hidden'); $('b-close').addEventListener('click', () => Native.close()); }

  async function enter() {
    $('login').classList.add('hidden'); $('main').classList.remove('hidden');
    await refresh().catch(() => {});
    clearInterval(poll); poll = setInterval(() => refresh().catch(() => {}), 3000);
    const first = document.querySelector('[data-action]'); first && first.focus();
  }

  // ---- render ----
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function refresh() { render(await api('/api/state')); }

  function render(s) {
    state = s;
    $('status').textContent = s.status;
    $('dot').className = 'dot ' + (s.statusClass === 'on' ? 'on' : s.statusClass === 'off' ? 'off' : '');
    $('s-watch').textContent = s.stats.watch; $('s-right').textContent = s.stats.right; $('s-wrong').textContent = s.stats.wrong;
    $('s-log').innerHTML = s.stats.log.length
      ? s.stats.log.map((l) => `<div class="${esc(l.cls)}">${esc(l.t)}　${esc(l.text)}</div>`).join('')
      : '今天还没有记录';
    $('pin-warn').classList.toggle('hidden', !s.defaultPin);
    $('phone-url').innerHTML = s.url
      ? `手机连上同一个 Wi-Fi，用浏览器打开 <code>${esc(s.url)}</code> 就能遥控（建议加到主屏幕）。`
      : '电视没有连上 Wi-Fi / 网线，暂时不能用手机遥控。';
    renderPerms(s.perms);
    if (!formFilled) fillForm(s);
  }

  function renderPerms(p) {
    const box = $('perm-box');
    if (p.a11y || (p.usage && p.overlay)) { box.classList.add('hidden'); return; }
    let html = '⚠️ 还差一步，答题电视暂时不会起作用：<br>' +
      '请在电视上打开 <b>设置 → 系统 → 无障碍</b>（有的型号叫「辅助功能」）→ 找到 <b>答题电视</b> → 打开。';
    if (onTV) html += '<div class="row" style="margin-top:10px"><button class="btn small" data-open="a11y">打开无障碍设置</button></div>';
    html += '<div class="hint" style="margin-top:10px">如果开关是灰色、按不了：到 设置 → 应用 → 答题电视，按遥控器的选项/菜单键，' +
      '选「允许受限制的设置」，再回来打开。</div>';
    box.innerHTML = html; box.classList.remove('hidden');
    box.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => Native.openSettings(b.dataset.open)));
  }

  function fillForm(s) {
    formFilled = true;
    ['interval', 'penalty', 'extra', 'maxPending', 'daily', 'bank', 'custom', 'lang'].forEach((k) => { $('c-' + k).value = s.cfg[k]; });
    $('apps').innerHTML = s.apps.length
      ? s.apps.map((a) => `<label class="app"><input type="checkbox" value="${esc(a.pkg)}" ${a.on ? 'checked' : ''}><span>${esc(a.label)}<small>${esc(a.pkg)}</small></span></label>`).join('')
      : '<div class="hint">没读到已安装的 App</div>';
  }

  // ---- actions ----
  const done = { unlock: '已解锁 2 小时', lock: '已锁屏', cancel: '已恢复答题模式', quiz: '下次打开视频 App 就会出题' };
  document.querySelectorAll('[data-action]').forEach((b) => b.addEventListener('click', async () => {
    try { render(await api('/api/action', { action: b.dataset.action })); toast(done[b.dataset.action]); }
    catch (e) { if (e.message !== 'login') toast(e.message); }
  }));

  $('b-save').addEventListener('click', async () => {
    const cfg = {};
    ['interval', 'penalty', 'extra', 'maxPending', 'daily'].forEach((k) => { cfg[k] = Number($('c-' + k).value); });
    cfg.bank = $('c-bank').value; cfg.custom = $('c-custom').value; cfg.lang = $('c-lang').value;
    cfg.apps = [...document.querySelectorAll('#apps input:checked')].map((i) => i.value);
    if (cfg.bank === 'custom' && !cfg.custom.split('\n').some((l) => l.split('|').filter((x) => x.trim()).length >= 3)) {
      toast('自定义题目是空的，请先写几道题'); return;
    }
    if (!cfg.apps.length) toast('提醒：没有勾选任何 App，答题电视不会计时');
    try { formFilled = false; render(await api('/api/config', cfg)); toast('已保存'); }
    catch (e) { if (e.message !== 'login') toast(e.message); }
  });

  $('b-pin').addEventListener('click', async () => {
    try { await api('/api/pin', { pin: $('c-pin').value.trim() }); $('c-pin').value = ''; toast('密码已修改'); refresh(); }
    catch (e) { if (e.message !== 'login') toast(e.message); }
  });

  // ---- start ----
  if (token) enter(); else { $('l-pin').focus(); }
})();
</script>
</body>
</html>
