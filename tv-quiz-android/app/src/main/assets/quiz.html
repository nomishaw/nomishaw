<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
  :root { --line:#2c4468; --panel:#1d2f4d; --muted:#9bb0cf; --accent:#3fb36b; --danger:#d9534f; --focus:#ffd75e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; color:#eef3fb; overflow:hidden;
    background: radial-gradient(ellipse at center, #1a2b48 0%, #0b1422 75%);
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus, input:focus { outline: 4px solid var(--focus); outline-offset: 2px; }
  .hidden { display:none !important; }
  .screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; }
  .box { width:min(1100px,100%); text-align:center; }
  .title { font-size:32px; font-weight:700; margin-bottom:8px; }
  .progress { color:var(--muted); font-size:20px; margin-bottom:26px; }
  .question { font-size:44px; line-height:1.4; margin-bottom:36px; min-height:1.4em; }
  #options { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  #options button { background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:18px 8px; font-size:30px; min-height:76px; transition: transform .1s; }
  #options button:focus { transform: scale(1.06); }
  #options button.right { background:var(--accent); border-color:var(--accent); }
  #options button.wrong { background:var(--danger); border-color:var(--danger); }
  .feedback { margin-top:26px; font-size:28px; font-weight:700; min-height:1.5em; }
  .bad { color:#ff8a80; } .good { color:#7ee2a0; }
  .big { font-size:80px; }
  h2 { font-size:44px; margin:10px 0; }
  .sub { color:var(--muted); font-size:22px; margin:0 0 30px; }
  .btn { background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:14px 26px; font-size:22px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); font-weight:700; }
  #parent-btn { position:fixed; top:16px; right:16px; font-size:16px; padding:8px 14px; opacity:.6; }
  #pin { background: rgba(0,0,0,.75); z-index:5; }
  #pin .card { background:#15233a; border:1px solid var(--line); border-radius:16px; padding:28px; width:min(420px,100%); text-align:center; }
  #pin input { width:100%; text-align:center; font-size:34px; letter-spacing:12px; padding:12px; margin:16px 0; background:#0d1726; color:#fff; border:1px solid var(--line); border-radius:10px; }
  #pin .row { display:flex; gap:12px; } #pin .row button { flex:1; }
</style>
</head>
<body>

<div id="quiz" class="screen hidden">
  <div class="box">
    <div class="title" id="t-title"></div>
    <div class="progress" id="q-progress"></div>
    <div class="question" id="q-text"></div>
    <div id="options"></div>
    <div class="feedback" id="q-feedback"></div>
  </div>
  <button class="btn" id="parent-btn"></button>
</div>

<div id="lock" class="screen hidden">
  <div class="box">
    <div class="big">🔒</div>
    <h2 id="t-locked"></h2>
    <p class="sub" id="lock-reason"></p>
    <button class="btn primary" id="lock-btn"></button>
  </div>
</div>

<div id="pin" class="screen hidden">
  <div class="card">
    <h2 style="font-size:28px;margin:0" id="t-pin"></h2>
    <input type="password" id="pin-input" inputmode="numeric" maxlength="8" autocomplete="off">
    <div class="bad" id="pin-err" style="min-height:1.4em"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="pin-cancel"></button>
      <button class="btn primary" id="pin-ok"></button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const read = () => JSON.parse(TV.state());
  let st = read();
  // The shared generator below reads its settings from S.cfg.
  const S = { cfg: { bank: st.bank, custom: st.custom, lang: st.lang || 'zh' } };
  const T = (zh, en) => (S.cfg.lang === 'en' ? en : zh);

  // ---------------- question bank ----------------
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const neg = (n) => (n < 0 ? `(${n})` : `${n}`);

  // Build 8 numeric options around the answer (plus optional "likely mistakes").
  function numOptions(ans, traps = [], fmt = (x) => String(x)) {
    const set = new Set([ans]);
    traps.forEach((t) => { if (Number.isInteger(t) && set.size < 8) set.add(t); });
    const spread = Math.max(3, Math.round(Math.abs(ans) * 0.3));
    let guard = 0;
    while (set.size < 8 && guard++ < 200) set.add(ans + ri(-spread, spread));
    return { answer: fmt(ans), options: shuffle([...set]).map(fmt) };
  }

  // 8 string options: the answer, likely mistakes, then random fillers.
  function pickOptions(answer, traps = [], more = () => null) {
    const set = new Set([String(answer)]);
    traps.forEach((t) => { if (t != null && set.size < 8) set.add(String(t)); });
    let guard = 0;
    while (set.size < 8 && guard++ < 300) { const x = more(); if (x != null) set.add(String(x)); }
    return { answer: String(answer), options: shuffle([...set]) };
  }
  const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
  const frac = (n, d) => { const g = gcd(n, d); return d / g === 1 ? String(n / g) : `${n / g}/${d / g}`; };

  const gens = {
    triangle() {
      const a = ri(25, 85), b = ri(20, 150 - a), c = 180 - a - b;
      const deg = (x) => `${x}°`;
      return { q: T(`三角形两个内角分别是 ${a}° 和 ${b}°，第三个角是多少？`, `A triangle has angles of ${a}° and ${b}°. The third angle is ___`),
               ...numOptions(c, [a + b, 180 - a, 180 - b, 90, 360 - a - b], deg) };
    },
    integers() {
      const a = ri(-30, 30), b = ri(-30, 30), op = pick(['+', '−']);
      const ans = op === '+' ? a + b : a - b;
      return { q: T(`计算：${neg(a)} ${op} ${neg(b)} = ?`, `Calculate: ${neg(a)} ${op} ${neg(b)} = ?`), ...numOptions(ans, [-ans, op === '+' ? a - b : a + b]) };
    },
    multiply() {
      const a = ri(-12, 12) || 3, b = ri(-12, 12) || -4;
      return { q: T(`计算：${neg(a)} × ${neg(b)} = ?`, `Calculate: ${neg(a)} × ${neg(b)} = ?`), ...numOptions(a * b, [-a * b, a + b]) };
    },
    power() {
      const base = pick([-3, -2, 2, 3, -1, 4, -4, 5]), e = base ** 2 > 9 ? 2 : ri(2, 3);
      const ans = base ** e;
      return { q: T(`计算：`, `Calculate: `) + `${neg(base)}${e === 2 ? '²' : '³'} = ?`, ...numOptions(ans, [-ans, base * e, -(Math.abs(base) ** e)]) };
    },
    equation() {
      const x = ri(-9, 12), a = pick([2, 3, 4, 5, -2, -3]), b = ri(-15, 15), c = a * x + b;
      const bs = b === 0 ? '' : b > 0 ? ` + ${b}` : ` − ${-b}`;
      return { q: T(`解方程：${a}x${bs} = ${c}，x = ?`, `Solve: ${a}x${bs} = ${c}. x = ?`), ...numOptions(x, [-x, (c + b) / a, c - b]) };
    },
    evaluate() {
      const x = ri(-6, 6), a = ri(2, 6), b = ri(-9, 9);
      const bs = b === 0 ? '' : b > 0 ? ` + ${b}` : ` − ${-b}`;
      return { q: T(`当 x = ${x} 时，${a}x${bs} 的值是多少？`, `If x = ${x}, what is the value of ${a}x${bs}?`), ...numOptions(a * x + b, [a * -x + b, a + x + b]) };
    },
    absolute() {
      const a = ri(-20, -1), b = ri(-20, 20);
      return { q: T(`计算：`, `Calculate: `) + `|${a}| + |${b}| = ?`, ...numOptions(Math.abs(a) + Math.abs(b), [a + b, Math.abs(a + b)]) };
    },
    percent() {
      const p = pick([10, 20, 25, 30, 40, 50, 75, 15]), n = pick([40, 60, 80, 120, 200, 240, 360]);
      return { q: T(`${n} 的 ${p}% 是多少？`, `What is ${p}% of ${n}?`), ...numOptions((n * p) / 100, [n - (n * p) / 100, p]) };
    },
    arith5() {
      const a = ri(12, 99), b = ri(3, 12), c = ri(10, 99);
      return { q: T(`计算：`, `Calculate: `) + `${a} × ${b} − ${c} = ?`, ...numOptions(a * b - c, [a * b, a * b + c - 10, a * b - c + 10]) };
    },
    division5() {
      const b = ri(3, 12), ans = ri(6, 40), r = 0;
      return { q: T(`计算：`, `Calculate: `) + `${b * ans + r} ÷ ${b} = ?`, ...numOptions(ans) };
    },
    area5() {
      const w = ri(3, 15), h = ri(3, 15);
      return { q: T(`长 ${w} 厘米、宽 ${h} 厘米的长方形，面积是多少平方厘米？`, `A rectangle is ${w} cm long and ${h} cm wide. What is its area in cm²?`), ...numOptions(w * h, [2 * (w + h), w + h]) };
    },
    perimeter5() {
      const w = ri(3, 20), h = ri(3, 20);
      return { q: T(`长 ${w} 米、宽 ${h} 米的长方形，周长是多少米？`, `A rectangle is ${w} m long and ${h} m wide. What is its perimeter in metres?`), ...numOptions(2 * (w + h), [w * h, w + h]) };
    },
    // ---------- 小二 / Primary 2 ----------
    p2add() {
      const a = ri(100, 800), b = ri(20, 999 - a);
      return { q: T(`计算：${a} + ${b} = ?`, `Calculate: ${a} + ${b} = ?`), ...numOptions(a + b, [a + b + 10, a + b - 10, a + b + 100]) };
    },
    p2sub() {
      const a = ri(200, 999), b = ri(20, a - 50);
      return { q: T(`计算：${a} − ${b} = ?`, `Calculate: ${a} − ${b} = ?`), ...numOptions(a - b, [a - b + 10, a - b - 10, a + b]) };
    },
    p2times() {
      const k = pick([2, 3, 4, 5, 10]), n = ri(2, 10);
      return { q: T(`计算：${k} × ${n} = ?`, `Calculate: ${k} × ${n} = ?`), ...numOptions(k * n, [k + n, k * (n + 1), k * (n - 1)]) };
    },
    p2div() {
      const k = pick([2, 3, 4, 5, 10]), n = ri(2, 10);
      return { q: T(`计算：${k * n} ÷ ${k} = ?`, `Calculate: ${k * n} ÷ ${k} = ?`), ...numOptions(n, [k, n + 1, n - 1]) };
    },
    p2groups() {
      const g = ri(3, 9), each = pick([2, 3, 4, 5, 10]);
      const [cz, iz, ce, ie] = pick([['袋', '苹果', 'bags', 'apples'], ['盒', '铅笔', 'boxes', 'pencils'], ['盘', '饼干', 'plates', 'cookies']]);
      return { q: T(`有 ${g} ${cz}${iz}，每${cz}有 ${each} 个，一共有多少个${iz}？`,
                    `There are ${g} ${ce} with ${each} ${ie} in each. How many ${ie} are there in all?`),
               ...numOptions(g * each, [g + each, g * each + each, g * each - each]) };
    },
    p2money() {
      const have = ri(3, 10) * 100, spend = ri(4, have / 5 - 4) * 5;
      const fmt = (c) => '$' + (c / 100).toFixed(2);
      const ans = have - spend;
      return { q: T(`小明有 ${fmt(have)}，买东西花了 ${fmt(spend)}，还剩多少钱？`, `Ali has ${fmt(have)}. He spends ${fmt(spend)}. How much money does he have left?`),
               ...pickOptions(fmt(ans), [fmt(ans + 10), fmt(ans - 10), fmt(ans + 100), fmt(ans - 100), fmt(have + spend)], () => fmt(Math.max(5, ans + ri(-30, 30) * 5))) };
    },
    p2time() {
      const h = ri(1, 11), m = pick([0, 15, 30, 45]), add = pick([15, 30, 45, 60, 90]);
      const fmt = (t) => `${Math.floor(t / 60) % 12 || 12}:${String(t % 60).padStart(2, '0')}`;
      const start = h * 60 + m, ans = start + add;
      return { q: T(`现在是 ${fmt(start)}，${add} 分钟后是几点？`, `It is ${fmt(start)} now. What time will it be in ${add} minutes?`),
               ...pickOptions(fmt(ans), [fmt(ans + 60), fmt(ans - 60), fmt(start + add + 15), fmt(start - add)], () => fmt(start + ri(1, 12) * 15)) };
    },
    p2length() {
      const m = ri(1, 9), cm = ri(5, 95);
      return { q: T(`${m} 米 ${cm} 厘米 = ? 厘米`, `${m} m ${cm} cm = ? cm`), ...numOptions(m * 100 + cm, [m * 10 + cm, m + cm, m * 1000 + cm]) };
    },
    p2half() {
      const quarter = Math.random() < 0.5, n = (quarter ? 4 : 2) * ri(2, 12);
      return { q: quarter ? T(`${n} 的四分之一是多少？`, `What is a quarter of ${n}?`) : T(`${n} 的一半是多少？`, `What is half of ${n}?`),
               ...numOptions(quarter ? n / 4 : n / 2, [n / 2, n * 2, n - 2]) };
    },
    // ---------- 小四 / Primary 4 ----------
    p4mul() {
      const a = ri(1200, 2400), b = ri(3, 9);
      return { q: T(`计算：${a} × ${b} = ?`, `Calculate: ${a} × ${b} = ?`), ...numOptions(a * b, [a * b + 10, a * b - 100, a * (b + 1)]) };
    },
    p4div() {
      const b = ri(3, 9), ans = ri(150, 999);
      return { q: T(`计算：${b * ans} ÷ ${b} = ?`, `Calculate: ${b * ans} ÷ ${b} = ?`), ...numOptions(ans, [ans + 10, ans - 10, ans + 100]) };
    },
    p4factor() {
      const n = pick([24, 30, 36, 40, 42, 48, 56, 60, 72]);
      const factors = []; for (let i = 2; i < n; i++) if (n % i === 0) factors.push(i);
      const ans = pick(factors);
      const non = shuffle(Array.from({ length: n }, (_, i) => i + 2).filter((x) => n % x !== 0 && x < n)).slice(0, 7);
      return { q: T(`下面哪个是 ${n} 的因数？`, `Which of these is a factor of ${n}?`), answer: String(ans), options: shuffle([ans, ...non]).map(String) };
    },
    p4multiple() {
      const k = pick([6, 7, 8, 9, 12]), ans = k * ri(3, 12);
      const non = new Set(); while (non.size < 7) { const x = ri(10, 120); if (x % k) non.add(x); }
      return { q: T(`下面哪个是 ${k} 的倍数？`, `Which of these is a multiple of ${k}?`), answer: String(ans), options: shuffle([ans, ...non]).map(String) };
    },
    p4round() {
      const n = ri(10000, 99999), [place, zh, en] = pick([[10, '十位', 'ten'], [100, '百位', 'hundred'], [1000, '千位', 'thousand']]);
      const r = (x) => Math.round(x / place) * place;
      const ans = r(n), fmt = (x) => x.toLocaleString('en-US');
      return { q: T(`把 ${fmt(n)} 四舍五入到最接近的${zh}`, `Round ${fmt(n)} to the nearest ${en}.`),
               ...pickOptions(fmt(ans), [fmt(Math.floor(n / place) * place), fmt(Math.ceil(n / place) * place), fmt(ans + place), fmt(ans - place), fmt(r(n) * 10 / 10 + place * 10)], () => fmt(ans + ri(-9, 9) * place)) };
    },
    p4fracadd() {
      const d1 = pick([4, 6, 8, 10, 12]), divs = [2, 3, 4, 5, 6].filter((d) => d1 % d === 0 && d < d1), d2 = pick(divs);
      const n2 = ri(1, d2 - 1), k = d1 / d2, n1 = ri(1, d1 - n2 * k - 1 > 0 ? d1 - n2 * k - 1 : 1);
      const num = n1 + n2 * k;
      const ans = frac(num, d1);
      return { q: T(`计算：${n1}/${d1} + ${n2}/${d2} = ?（化成最简分数）`, `Calculate: ${n1}/${d1} + ${n2}/${d2} = ? (simplest form)`),
               ...pickOptions(ans, [frac(n1 + n2, d1 + d2), frac(n1 + n2, d1), frac(num + 1, d1), frac(Math.max(1, num - 1), d1), `${num}/${d1 * 2}`], () => frac(ri(1, d1 - 1), d1)) };
    },
    p4fracof() {
      const d = pick([3, 4, 5, 6, 8]), n = ri(1, d - 1), whole = d * ri(3, 12);
      return { q: T(`${whole} 的 ${n}/${d} 是多少？`, `What is ${n}/${d} of ${whole}?`), ...numOptions((whole / d) * n, [whole / d, whole - (whole / d) * n, whole * n]) };
    },
    p4decimal() {
      const a = ri(105, 899), b = ri(15, 499), add = Math.random() < 0.6;
      const fmt = (h) => (h / 100).toFixed(2);
      const ans = add ? a + b : a - b;
      if (!add && ans <= 0) return gens.p4decimal();
      const op = add ? '+' : '−';
      return { q: T(`计算：${fmt(a)} ${op} ${fmt(b)} = ?`, `Calculate: ${fmt(a)} ${op} ${fmt(b)} = ?`),
               ...pickOptions(fmt(ans), [fmt(ans + 10), fmt(ans - 10), fmt(ans + 100), fmt(add ? a - b : a + b)], () => fmt(Math.max(1, ans + ri(-20, 20)))) };
    },
    p4angle() {
      const a = ri(25, 155);
      return { q: T(`两个角在一条直线上，其中一个是 ${a}°，另一个是多少度？`, `Two angles are on a straight line. One is ${a}°. What is the other angle?`),
               ...numOptions(180 - a, [360 - a, 90 - a > 0 ? 90 - a : 90 + a, 180 + a].filter((x) => x > 0), (x) => `${x}°`) };
    },
    p4time24() {
      const h = ri(1, 11), m = pick([5, 10, 15, 20, 30, 40, 45, 50, 55]);
      const mm = String(m).padStart(2, '0'), ans = `${h + 12}:${mm}`;
      return { q: T(`下午 ${h}:${mm} 用 24 小时制怎么写？`, `Write ${h}:${mm} p.m. in 24-hour time.`),
               ...pickOptions(ans, [`${String(h).padStart(2, '0')}:${mm}`, `${h + 10}:${mm}`, `${h + 11}:${mm}`, `${h + 13}:${mm}`, `${h + 12}:${String((m + 30) % 60).padStart(2, '0')}`], () => `${ri(13, 23)}:${mm}`) };
    },
    p4area() {
      const w = ri(6, 25), h = ri(4, 20), area = Math.random() < 0.5;
      return area
        ? { q: T(`长 ${w} 厘米、宽 ${h} 厘米的长方形，面积是多少平方厘米？`, `A rectangle is ${w} cm long and ${h} cm wide. What is its area in cm²?`), ...numOptions(w * h, [2 * (w + h), w + h, w * h + w]) }
        : { q: T(`长 ${w} 米、宽 ${h} 米的长方形，周长是多少米？`, `A rectangle is ${w} m long and ${h} m wide. What is its perimeter in metres?`), ...numOptions(2 * (w + h), [w * h, w + h, 2 * w + h]) };
    },
    english() {
      const words = [['apple', '苹果'], ['library', '图书馆'], ['weather', '天气'], ['science', '科学'], ['history', '历史'],
        ['triangle', '三角形'], ['careful', '小心的'], ['delicious', '美味的'], ['yesterday', '昨天'], ['umbrella', '雨伞'],
        ['kitchen', '厨房'], ['homework', '家庭作业'], ['beautiful', '美丽的'], ['country', '国家'], ['dangerous', '危险的'],
        ['different', '不同的'], ['hospital', '医院'], ['exercise', '锻炼'], ['vegetable', '蔬菜'], ['important', '重要的']];
      const [en, zh] = pick(words);
      const others = shuffle(words.filter((w) => w[0] !== en)).slice(0, 7);
      if (S.cfg.lang === 'en') {
        return { q: `Which word means “${zh}”?`, answer: en, options: shuffle([en, ...others.map((w) => w[0])]) };
      }
      return { q: `“${en}” 是什么意思？`, answer: zh, options: shuffle([zh, ...others.map((w) => w[1])]) };
    },
  };

  function parseCustom() {
    return S.cfg.custom.split('\n').map((l) => l.split('|').map((s) => s.trim()).filter(Boolean))
      .filter((p) => p.length >= 3)
      .map(([q, answer, ...wrong]) => () => ({ q, answer, options: shuffle([answer, ...wrong.slice(0, 7)]) }));
  }

  function nextQuestion() {
    const banks = {
      math7: ['triangle', 'integers', 'multiply', 'power', 'equation', 'evaluate', 'absolute', 'percent'],
      math5: ['arith5', 'division5', 'area5', 'perimeter5', 'triangle', 'percent'],
      p2: ['p2add', 'p2sub', 'p2times', 'p2div', 'p2groups', 'p2money', 'p2time', 'p2length', 'p2half'],
      p4: ['p4mul', 'p4div', 'p4factor', 'p4multiple', 'p4round', 'p4fracadd', 'p4fracof', 'p4decimal', 'p4angle', 'p4time24', 'p4area'],
      mix: ['triangle', 'integers', 'equation', 'evaluate', 'percent', 'english', 'english'],
      custom: [],
    };
    const pool = (banks[S.cfg.bank] || banks.math7).map((k) => gens[k]);
    const custom = parseCustom();
    const all = S.cfg.bank === 'custom' ? custom : pool.concat(custom);
    return pick(all.length ? all : pool.length ? pool : [gens.integers])();
  }

  let current = null, answered = false, cooldownTimer = null, shown = '';

  function show(id) {
    ['quiz', 'lock'].forEach((s) => $(s).classList.toggle('hidden', s !== id));
    shown = id;
  }

  function applyLang() {
    document.documentElement.lang = T('zh-CN', 'en');
    $('t-title').textContent = T('休息一下，答对才能继续', 'Quiz time! Answer correctly to keep watching');
    $('parent-btn').textContent = T('家长', 'Parent');
    $('t-locked').textContent = T('电视已锁定', 'TV is locked');
    $('lock-btn').textContent = T('家长解锁', 'Parent unlock');
    $('t-pin').textContent = T('家长密码', 'Parent PIN');
    $('pin-cancel').textContent = T('取消', 'Cancel');
    $('pin-ok').textContent = T('确定', 'OK');
  }
  const lockReason = () => st.lockType === 'daily'
    ? T('今天已经看满 ' + st.daily + ' 分钟啦，明天再看！', "That's " + st.daily + ' minutes for today. See you tomorrow!')
    : T('家长已锁屏，去做点别的事吧！', 'A parent locked the TV. Time to do something else!');

  function render() {
    S.cfg.bank = st.bank; S.cfg.custom = st.custom; S.cfg.lang = st.lang || 'zh';
    applyLang();
    if (st.mode === 'none') { TV.done(); return; }
    if (st.mode === 'lock') {
      clearInterval(cooldownTimer);
      $('lock-reason').textContent = lockReason();
      if (shown !== 'lock') { show('lock'); $('lock-btn').focus(); }
      return;
    }
    if (shown !== 'quiz') {
      show('quiz');
      if (st.cooldownLeft > 0) startCooldown(st.cooldownLeft); else renderQuestion();
    }
  }

  function renderQuestion() {
    current = nextQuestion(); answered = false;
    $('q-text').textContent = current.q;
    $('q-feedback').textContent = ''; $('q-feedback').className = 'feedback';
    $('q-progress').textContent = st.pending > 1 ? T('还需答对 ' + st.pending + ' 道题', st.pending + ' correct answers needed') : T('答对这一道就能继续看', 'Get this one right to keep watching');
    const box = $('options'); box.innerHTML = '';
    current.options.forEach((opt) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = opt;
      b.addEventListener('click', () => answer(b, opt));
      box.appendChild(b);
    });
    box.firstChild && box.firstChild.focus();
  }

  function answer(btn, opt) {
    if (answered) return;
    answered = true;
    const buttons = [...$('options').children];
    buttons.forEach((b) => (b.disabled = true));
    const ok = opt === current.answer;
    st = JSON.parse(TV.answer(ok, current.q, String(opt), String(current.answer)));
    const fb = $('q-feedback');
    if (ok) {
      btn.classList.add('right');
      fb.className = 'feedback good';
      fb.textContent = st.pending ? T('答对了！还剩 ' + st.pending + ' 道', 'Correct! ' + st.pending + ' more to go') : T('答对了！继续看吧 🎉', 'Correct! Enjoy your show 🎉');
      setTimeout(() => { if (st.mode === 'quiz') renderQuestion(); else render(); }, 1300);
    } else {
      btn.classList.add('wrong');
      const right = buttons.find((b) => b.textContent === String(current.answer));
      right && right.classList.add('right');
      startCooldown(st.cooldownLeft);
    }
  }

  function startCooldown(ms) {
    clearInterval(cooldownTimer);
    const end = Date.now() + ms;
    if (!current) { $('q-text').textContent = ''; $('options').innerHTML = ''; }
    $('q-progress').textContent = T('还需答对 ' + st.pending + ' 道题', st.pending + ' correct answers needed');
    const tick = () => {
      const left = Math.ceil((end - Date.now()) / 1000);
      if (left <= 0) { clearInterval(cooldownTimer); renderQuestion(); return; }
      $('q-feedback').className = 'feedback bad';
      $('q-feedback').textContent = T('答错了，' + left + ' 秒后换一道新题', 'Wrong! New question in ' + left + 's') + (st.pending > 1 ? T('（已追加，共需答对 ' + st.pending + ' 道）', ' (extra added: ' + st.pending + ' needed)') : '');
    };
    tick(); cooldownTimer = setInterval(tick, 500);
  }

  // Parent can unlock or lock from the phone at any moment: follow the state.
  setInterval(() => {
    if (!$('pin').classList.contains('hidden')) return;
    const s = read();
    if (s.mode === 'none') { TV.done(); return; }
    if (s.mode !== st.mode) { st = s; render(); }
    else if (s.lang !== st.lang) { st.lang = s.lang; S.cfg.lang = s.lang; applyLang(); }
    else { st.pending = s.pending; }
  }, 1500);

  // ---- parent PIN ----
  function askPin() {
    $('pin-input').value = ''; $('pin-err').textContent = '';
    $('pin').classList.remove('hidden'); $('pin-input').focus();
  }
  function closePin() {
    $('pin').classList.add('hidden');
    const f = shown === 'lock' ? $('lock-btn') : $('options').querySelector('button:not([disabled])');
    f && f.focus();
  }
  $('parent-btn').addEventListener('click', askPin);
  $('lock-btn').addEventListener('click', askPin);
  $('pin-cancel').addEventListener('click', closePin);
  const submitPin = () => { if (!TV.checkPin($('pin-input').value)) { $('pin-input').value = ''; $('pin-err').textContent = T('密码不对（连错 5 次锁 1 分钟）', 'Wrong PIN (5 wrong tries locks it for 1 minute)'); } };
  $('pin-ok').addEventListener('click', submitPin);
  $('pin-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitPin(); });

  // ---- TV remote: arrow keys move across the 4-column answer grid ----
  document.addEventListener('keydown', (e) => {
    if (!$('pin').classList.contains('hidden') || shown !== 'quiz') return;
    const btns = [...$('options').children];
    const i = btns.indexOf(document.activeElement);
    const move = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -4, ArrowDown: 4 }[e.key];
    if (move === undefined || !btns.length) return;
    if (i < 0) {
      if (e.key === 'ArrowDown' || document.activeElement === document.body) { e.preventDefault(); btns[0].focus(); }
      return;
    }
    const n = i + move;
    if (n < 0) { e.preventDefault(); $('parent-btn').focus(); return; }
    e.preventDefault();
    btns[Math.min(btns.length - 1, n)].focus();
  });

  render();
})();
</script>
</body>
</html>
